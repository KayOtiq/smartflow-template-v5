
name: Playwright CI
on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Lint and format
        run: pnpm lint && pnpm format
      - name: Run Playwright tests with Allure reporter
        run: pnpm exec playwright test --reporter=dot,allure-playwright
      - name: Upload Allure results (main/develop only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v3
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
      - name: Publish Allure report (main/develop only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          pnpm exec allure generate allure-results --clean -o allure-report
          pnpm exec allure open allure-report &
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
